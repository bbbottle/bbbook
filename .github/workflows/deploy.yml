name: Build and deploy to ONCE

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: bbbook
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          echo "image=localhost:5000/bbbook" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -t "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }}" -t "${{ steps.vars.outputs.image }}:latest" .

      - name: Push to local registry
        run: |
          docker push --all-tags "${{ steps.vars.outputs.image }}"

      - name: Verify catalog
        run: |
          curl -sS http://127.0.0.1:5000/v2/_catalog

      - name: Deploy or update with ONCE
        env:
          # Required for the API to start; keep stable across deployments so existing tokens remain valid
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AUTH_DEFAULT_ADMIN_PASSWORD: ${{ secrets.AUTH_DEFAULT_ADMIN_PASSWORD }}
          AUTH_TOTP_SECRET_KEY: ${{ secrets.AUTH_TOTP_SECRET_KEY }}
          # Semantic SSH connection values for the entrypoint to assemble /root/.ssh/config
          KINDLE_SSH_HOSTNAME: ${{ secrets.KINDLE_SSH_HOSTNAME }}
          KINDLE_SSH_USER: ${{ secrets.KINDLE_SSH_USER }}
          KINDLE_SSH_PORT: ${{ secrets.KINDLE_SSH_PORT }}
          KINDLE_SSH_KEY: ${{ secrets.KINDLE_SSH_KEY }}
        run: |
          KINDLE_SSH_KEY_B64=$(printf '%s' "$KINDLE_SSH_KEY" | base64 -w0)
          echo "::add-mask::$KINDLE_SSH_KEY_B64"

          if once list 2>/dev/null | grep -q "kdl.bbki.ng"; then
            once update kdl.bbki.ng \
              --image "${{ steps.vars.outputs.image }}:latest" \
              --env "AUTH_JWT_SECRET=$AUTH_JWT_SECRET" \
              --env "AUTH_DEFAULT_ADMIN_PASSWORD=$AUTH_DEFAULT_ADMIN_PASSWORD" \
              --env "AUTH_TOTP_SECRET_KEY=$AUTH_TOTP_SECRET_KEY" \
              --env "KINDLE_SSH_HOSTNAME=$KINDLE_SSH_HOSTNAME" \
              --env "KINDLE_SSH_USER=$KINDLE_SSH_USER" \
              --env "KINDLE_SSH_PORT=$KINDLE_SSH_PORT" \
              --env "KINDLE_SSH_KEY=$KINDLE_SSH_KEY_B64"
          else
            once deploy "${{ steps.vars.outputs.image }}:latest" \
              --host kdl.bbki.ng \
              --env "AUTH_JWT_SECRET=$AUTH_JWT_SECRET" \
              --env "AUTH_DEFAULT_ADMIN_PASSWORD=$AUTH_DEFAULT_ADMIN_PASSWORD" \
              --env "AUTH_TOTP_SECRET_KEY=$AUTH_TOTP_SECRET_KEY" \
              --env "KINDLE_SSH_HOSTNAME=$KINDLE_SSH_HOSTNAME" \
              --env "KINDLE_SSH_USER=$KINDLE_SSH_USER" \
              --env "KINDLE_SSH_PORT=$KINDLE_SSH_PORT" \
              --env "KINDLE_SSH_KEY=$KINDLE_SSH_KEY_B64"
          fi

      - name: Prune local Docker artifacts
        if: always()
        run: docker system prune -f
